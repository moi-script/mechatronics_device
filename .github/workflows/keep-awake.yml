# Pings the live API so Render's free plan doesn't put it to sleep, and so
# the Atlas cluster sees a connection and never pauses. GitHub may run this a
# few minutes late; that is fine, Render only sleeps after ~15 idle minutes.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://mechatronicdevice.vercel.app/api/health
