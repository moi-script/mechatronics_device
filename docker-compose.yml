services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: mechatronic_trainer
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/mechatronic_trainer
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env before deploying}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      TRUST_PROXY: 'true'
    expose:
      - '4000'

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Server-side only: the browser always talks to /api on this origin,
      # and the proxy route resolves this per request.
      API_URL: http://api:4000
    ports:
      # Override WEB_PORT when 3000 is already taken on the host.
      - '${WEB_PORT:-3000}:3000'

volumes:
  mongo-data:
